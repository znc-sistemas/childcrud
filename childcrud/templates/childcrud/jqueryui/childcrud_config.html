<div class="fieldset">
    <h3><div class="collapse-icon uncollapsed"></div> </h3>
    <div class="fields">
      {% if dialog == "all" %}<div id="{{ variable_name }}-dialog" title="{{ verbose_name }}" style="display:none">{% endif %}
      <h2><input id="{{ variable_name }}-bt" type="button" value="Adicionar" /></h2>
      {% if dialog == "form" %}<div id="{{ variable_name }}-dialog" title="{{ verbose_name }}" style="display:none">{% endif %}
      <form id="{{ variable_name }}-form" method="post"></form>
      {% if dialog == "form" %}</div>{% endif %}
      <div id="{{ variable_name }}-list"></div>
      {% if dialog == "all" %}</div>{% endif %}
    </div>
</div>
